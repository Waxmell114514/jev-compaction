# Two ways to cut a release:
# - push an annotated tag vX.Y.Z; its message becomes the release notes;
# - run this workflow by hand with a tag name; it tags the commit it runs on and
#   takes the notes from .github/releases/<tag>.md (first line is the title).
#   Run by hand for a release that already exists, it updates the title, notes
#   and assets instead.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create or update, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  ASSETS: docs/tour.gif

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes=".github/releases/$TAG.md"
          if [ -f "$notes" ]; then
            title="$(head -n 1 "$notes")"; body="$(tail -n +3 "$notes")"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$title" --notes "$body"
              for name in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
                case " $ASSETS " in *"/$name "*) ;; *) gh release delete-asset "$TAG" "$name" -y ;; esac
              done
              gh release upload "$TAG" $ASSETS --clobber
            else
              gh release create "$TAG" $ASSETS --target "$GITHUB_SHA" --title "$title" --notes "$body"
            fi
          else
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            gh release create "$TAG" $ASSETS --verify-tag --notes-from-tag \
              --title "$(git tag -l --format='%(contents:subject)' "$TAG")"
          fi
