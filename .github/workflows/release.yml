# Two ways to cut a release:
# - push an annotated tag vX.Y.Z; its message becomes the release notes;
# - run this workflow by hand with a tag name; it tags the commit it runs on and
#   takes the notes from .github/releases/<tag>.md (first line is the title).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes=".github/releases/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" docs/demo.gif --target "$GITHUB_SHA" \
              --title "$(head -n 1 "$notes")" --notes "$(tail -n +3 "$notes")"
          else
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            gh release create "$TAG" docs/demo.gif --verify-tag --notes-from-tag \
              --title "$(git tag -l --format='%(contents:subject)' "$TAG")"
          fi
